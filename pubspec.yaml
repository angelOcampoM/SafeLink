name: safelink
description: "SafeLink - Servicio de respuesta de seguridad privada bajo demanda (prototipo UTEZ)."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Navegación declarativa con redirección por rol.
  go_router: ^16.0.0
  # Tipografía Inter (se descarga en la primera ejecución y queda en caché).
  google_fonts: ^6.2.1
  # Cliente HTTP real contra el backend (BE-01 paso 8).
  http: ^1.6.0
  # U-02: la sesión sobrevive a cerrar la app (almacenamiento del teléfono).
  shared_preferences: ^2.5.6
  # U-01 · U-02: pedir al sistema cámara, ubicación y notificaciones.
  permission_handler: ^12.0.1
  # U-06 · U-07 · G-06: GPS real. `Position.heading` también da el rumbo, así que
  # no hace falta un paquete aparte de brújula.
  geolocator: ^14.1.2
  # U-06: la foto automática de la alerta, sin que el usuario tenga que encuadrar.
  camera: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Reloj falso para probar tiempos sin depender del reloj real (CR-F02). Ya venía con
  # flutter_test como dependencia indirecta: declararla no descarga nada nuevo.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
