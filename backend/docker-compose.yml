services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-safelink}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - safelink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Dentro de la red de Compose la base se llama "db" y usa el puerto 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-safelink}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-safelink}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  safelink_pgdata:
